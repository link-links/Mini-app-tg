<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Catch Button</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    #score {
      font-size: 24px;
      margin-top: 20px;
    }

    #time {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #btn {
      position: absolute;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      cursor: pointer;
      transition: 0.1s;
    }

    #start {
      margin-top: 100px;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🎯 Поймай кнопку</h1>
<div id="score">Очки: 0</div>
<div id="time">Время: 15</div>

<button id="start">Начать</button>
<button id="btn" style="display:none;">ЖМИ!</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  let score = 0;
  let time = 15;
  let gameInterval;
  let moveInterval;

  const btn = document.getElementById("btn");
  const scoreText = document.getElementById("score");
  const timeText = document.getElementById("time");
  const startBtn = document.getElementById("start");

  function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    btn.style.left = x + "px";
    btn.style.top = y + "px";
  }

  btn.onclick = () => {
    score++;
    scoreText.innerText = "Очки: " + score;
    moveButton();
  };

  startBtn.onclick = () => {
    score = 0;
    time = 15;

    scoreText.innerText = "Очки: 0";
    timeText.innerText = "Время: 15";

    startBtn.style.display = "none";
    btn.style.display = "block";

    moveButton();

    moveInterval = setInterval(moveButton, 800);

    gameInterval = setInterval(() => {
      time--;
      timeText.innerText = "Время: " + time;

      if (time <= 0) {
        clearInterval(gameInterval);
        clearInterval(moveInterval);
        btn.style.display = "none";
        startBtn.style.display = "block";

        alert("Игра окончена! Очки: " + score);

        // отправка результата в бота
        tg.sendData("score:" + score);
      }
    }, 1000);
  };
</script>

</body>
</html>
