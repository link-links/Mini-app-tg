<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Status Bio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #020617, #0f172a);
    color: white;
    text-align: center;
  }

  .card {
    margin: 30px 15px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #00f0ff;
    box-shadow: 0 0 20px #00f0ff;
  }

  .name {
    font-size: 22px;
    margin-top: 10px;
    font-weight: bold;
  }

  .status {
    margin-top: 5px;
    font-size: 14px;
    color: #22c55e;
  }

  .bio {
    margin-top: 10px;
    opacity: 0.8;
  }

  .btn {
    margin-top: 12px;
    padding: 12px;
    width: 100%;
    border-radius: 12px;
    border: none;
    background: #020617;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .btn:hover {
    transform: scale(1.05);
    border: 1px solid #00f0ff;
    box-shadow: 0 0 15px #00f0ff;
  }

  .menu {
    display: none;
    padding: 20px;
  }

</style>
</head>

<body>

<div class="card" id="main">
  <img src="https://i.imgur.com/6VBx3io.png" class="avatar">

  <div class="name" id="name">Loading...</div>
  <div class="status">● ONLINE</div>
  <div class="bio">🚀 Elite Player | 💻 Mini App Dev</div>

  <button class="btn" onclick="openMenu('links')">🔗 Links</button>
  <button class="btn" onclick="openMenu('profile')">👤 Profile</button>
  <button class="btn" onclick="sendProfile()">📤 Send Profile</button>
</div>

<!-- LINKS -->
<div class="menu" id="links">
  <div class="card">
    <h2>🔗 Links</h2>

    <button class="btn" onclick="openLink('https://t.me/')">Telegram</button>
    <button class="btn" onclick="openLink('https://youtube.com/')">YouTube</button>

    <button class="btn" onclick="back()">⬅ Back</button>
  </div>
</div>

<!-- PROFILE -->
<div class="menu" id="profile">
  <div class="card">
    <h2>👤 Profile</h2>

    <p>💰 Balance: 1 250</p>
    <p>🏆 Level: 7</p>
    <p>🔥 Status: VIP</p>

    <button class="btn" onclick="back()">⬅ Back</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

if (user) {
  document.getElementById("name").innerText =
    user.first_name + (user.last_name ? " " + user.last_name : "");
}

// меню
function openMenu(menu) {
  document.getElementById("main").style.display = "none";
  document.getElementById(menu).style.display = "block";
}

function back() {
  document.getElementById("main").style.display = "block";
  document.getElementById("links").style.display = "none";
  document.getElementById("profile").style.display = "none";
}

// ссылки
function openLink(url) {
  tg.openLink(url);
}

// отправка
function sendProfile() {
  tg.sendData("profile:" + JSON.stringify(user));
}
</script>

</body>
</html>
