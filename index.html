<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Bio Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
}

/* контейнер */
.container {
  padding: 20px;
}

/* карточка */
.card {
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

/* аватар */
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid #3b82f6;
  margin-top: 10px;
}

/* имя */
h1 {
  margin: 10px 0 5px;
  font-size: 24px;
}

/* статус */
.status {
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 15px;
}

/* кнопки */
.btn {
  display: block;
  margin: 10px auto;
  padding: 14px;
  width: 90%;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.03);
}

/* вторичные кнопки */
.btn2 {
  background: rgba(255,255,255,0.08);
}

/* меню */
.menu {
  display: none;
  padding: 20px;
}

/* бейдж */
.badge {
  display: inline-block;
  padding: 5px 10px;
  background: #22c55e;
  border-radius: 10px;
  font-size: 12px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container" id="main">
  <div class="card">

    <img src="https://i.imgur.com/6VBx3io.png" class="avatar">

    <h1 id="name">Loading...</h1>

    <div class="badge">ONLINE</div>
    <div class="status">🎮 RP Player | 💻 Mini App Dev</div>

    <button class="btn" onclick="openMenu('links')">🔗 Соцсети</button>
    <button class="btn" onclick="openMenu('about')">📄 Обо мне</button>
    <button class="btn btn2" onclick="sendProfile()">📤 Отправить</button>

  </div>
</div>

<!-- ссылки -->
<div class="menu" id="links">
  <div class="card">
    <h2>🔗 Соцсети</h2>

    <button class="btn" onclick="openLink('https://t.me/')">Telegram</button>
    <button class="btn" onclick="openLink('https://youtube.com/')">YouTube</button>
    <button class="btn btn2" onclick="back()">⬅ Назад</button>
  </div>
</div>

<!-- обо мне -->
<div class="menu" id="about">
  <div class="card">
    <h2>📄 Обо мне</h2>
    <p>🔥 Играю на RP серверах<br>⚡ Делаю Telegram Mini Apps<br>🚀 Развиваю проекты</p>

    <button class="btn btn2" onclick="back()">⬅ Назад</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// имя пользователя
const user = tg.initDataUnsafe.user;

if (user) {
  document.getElementById("name").innerText =
    user.first_name + (user.last_name ? " " + user.last_name : "");
}

// меню
function openMenu(menu) {
  document.getElementById("main").style.display = "none";
  document.getElementById(menu).style.display = "block";
}

function back() {
  document.getElementById("main").style.display = "block";
  document.getElementById("links").style.display = "none";
  document.getElementById("about").style.display = "none";
}

// открыть ссылку
function openLink(url) {
  tg.openLink(url);
}

// отправка данных
function sendProfile() {
  tg.sendData("PROFILE:" + JSON.stringify(user));
}
</script>

</body>
</html>
